<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUCHA — Coming Soon</title>
<style>
  :root {
    --black: #060606;
    --white: #f0ede8;
    --acid: #C8FF00;
    --dim: #333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: crosshair;
  }

  /* NOISE TEXTURE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
    opacity: 0.4;
  }

  /* SCAN LINES */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(200,255,0,0.012) 3px,
      rgba(200,255,0,0.012) 4px
    );
    pointer-events: none;
    z-index: 9;
  }

  /* CORNER MARKS */
  .corner {
    position: fixed;
    width: 40px;
    height: 40px;
    z-index: 20;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--acid);
  }
  .corner::before { width: 1px; height: 100%; }
  .corner::after { width: 100%; height: 1px; }

  .corner-tl { top: 24px; left: 24px; }
  .corner-tl::before { top: 0; left: 0; }
  .corner-tl::after { top: 0; left: 0; }

  .corner-tr { top: 24px; right: 24px; }
  .corner-tr::before { top: 0; right: 0; left: auto; }
  .corner-tr::after { top: 0; right: 0; }

  .corner-bl { bottom: 24px; left: 24px; }
  .corner-bl::before { bottom: 0; top: auto; left: 0; }
  .corner-bl::after { bottom: 0; top: auto; left: 0; }

  .corner-br { bottom: 24px; right: 24px; }
  .corner-br::before { bottom: 0; top: auto; right: 0; left: auto; }
  .corner-br::after { bottom: 0; top: auto; right: 0; }

  /* MAIN CONTAINER */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    position: relative;
    z-index: 5;
    animation: fadeIn 1.2s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* THE LOGO SVG */
  .logo-wrap {
    position: relative;
    animation: fadeIn 1s 0.2s both;
  }

  .logo-svg {
    width: clamp(280px, 70vw, 640px);
    height: auto;
    display: block;
  }

  /* GLITCH EFFECT ON LOGO */
  .logo-wrap::before,
  .logo-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    opacity: 0;
  }

  .glitch-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: glitch1 6s infinite;
  }

  .glitch-layer-2 {
    animation: glitch2 6s infinite;
  }

  @keyframes glitch1 {
    0%, 88%, 100% { opacity: 0; }
    90% { opacity: 0.7; clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); transform: translateX(-3px); }
    92% { opacity: 0; }
  }

  @keyframes glitch2 {
    0%, 92%, 100% { opacity: 0; }
    94% { opacity: 0.5; clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%); transform: translateX(3px); }
    96% { opacity: 0; }
  }

  /* TAG LINE */
  .tagline {
    font-family: 'Courier New', 'Courier', monospace;
    font-size: clamp(9px, 1.4vw, 13px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #444;
    margin-top: 28px;
    animation: fadeIn 1s 0.5s both;
    text-align: center;
  }

  .tagline span {
    color: var(--acid);
    opacity: 0.8;
  }

  /* EMAIL CAPTURE */
  .waitlist {
    margin-top: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: fadeIn 1s 0.8s both;
  }

  .waitlist-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #3a3a3a;
  }

  .waitlist-row {
    display: flex;
    gap: 0;
    border: 1px solid #222;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .waitlist-row:focus-within {
    border-color: var(--acid);
  }

  .waitlist-input {
    background: transparent;
    border: none;
    outline: none;
    padding: 14px 20px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--white);
    width: 240px;
  }

  .waitlist-input::placeholder {
    color: #333;
    letter-spacing: 2px;
  }

  .waitlist-btn {
    background: var(--acid);
    border: none;
    padding: 14px 22px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--black);
    cursor: pointer;
    font-weight: bold;
    transition: opacity 0.2s;
  }

  .waitlist-btn:hover { opacity: 0.85; }

  .waitlist-note {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: #2a2a2a;
    text-transform: uppercase;
  }

  /* BOTTOM BAR */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    border-top: 1px solid #111;
  }

  .bottom-left, .bottom-right {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: #2a2a2a;
    text-transform: uppercase;
  }

  .bottom-right { color: #1e1e1e; }

  /* SUCCESS STATE */
  .success-msg {
    display: none;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--acid);
    text-transform: uppercase;
    text-align: center;
    padding: 14px 0;
  }

  /* TOP BAR */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    z-index: 20;
    border-bottom: 1px solid #0e0e0e;
  }

  .top-item {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: #1e1e1e;
    text-transform: uppercase;
  }

  /* DOWNLOAD BUTTON */
  .download-section {
    position: fixed;
    top: 50%;
    right: 28px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 30;
  }

  .dl-btn {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    padding: 10px 12px;
    text-transform: uppercase;
    cursor: pointer;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    border: 1px solid #1e1e1e;
    background: transparent;
    color: #333;
    transition: all 0.2s;
  }

  .dl-btn:hover {
    border-color: var(--acid);
    color: var(--acid);
  }

  .dl-btn.primary {
    border-color: #333;
    color: #555;
  }
</style>
</head>
<body>

<!-- CORNER MARKS -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-item">Toronto · Canada</div>
  <div class="top-item">Est. 2025</div>
  <div class="top-item">Drop 001 — 2035</div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

  <div class="logo-wrap">
    <!-- PRIMARY LOGO SVG — 100% royalty free, pure vector, no external assets -->
    <svg class="logo-svg" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FUC#A Logo">
      <defs>
        <!-- Acid green glow filter -->
        <filter id="acidGlow" x="-5%" y="-5%" width="110%" height="110%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>

      <!-- F -->
      <rect x="0" y="10" width="14" height="140" fill="#f0ede8"/>
      <rect x="0" y="10" width="72" height="14" fill="#f0ede8"/>
      <rect x="0" y="75" width="58" height="12" fill="#f0ede8"/>

      <!-- U -->
      <rect x="98" y="10" width="14" height="126" fill="#f0ede8"/>
      <rect x="98" y="136" width="68" height="14" fill="#f0ede8"/>
      <rect x="152" y="10" width="14" height="126" fill="#f0ede8"/>

      <!-- C -->
      <rect x="188" y="10" width="68" height="14" fill="#f0ede8"/>
      <rect x="188" y="10" width="14" height="140" fill="#f0ede8"/>
      <rect x="188" y="136" width="68" height="14" fill="#f0ede8"/>

      <!-- # (HASH) — THE HERO CHARACTER in acid green -->
      <!-- Vertical bars -->
      <rect x="285" y="20" width="10" height="120" fill="#C8FF00"/>
      <rect x="313" y="20" width="10" height="120" fill="#C8FF00"/>
      <!-- Horizontal bars -->
      <rect x="272" y="62" width="50" height="10" fill="#C8FF00"/>
      <rect x="272" y="90" width="50" height="10" fill="#C8FF00"/>

      <!-- A -->
      <!-- Left diagonal -->
      <polygon points="368,150 390,10 396,10 404,10 410,10 432,150 418,150 400,46 382,150" fill="#f0ede8"/>
      <!-- Crossbar -->
      <rect x="376" y="92" width="48" height="12" fill="#f0ede8"/>

      <!-- Subtle acid underline accent -->
      <rect x="0" y="158" width="640" height="2" fill="#C8FF00" opacity="0.15"/>
    </svg>

    <!-- Glitch layers (clone via CSS, visual only) -->
    <svg class="logo-svg glitch-layer" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;top:0;left:0;">
      <rect x="0" y="10" width="14" height="140" fill="#C8FF00"/>
      <rect x="0" y="10" width="72" height="14" fill="#C8FF00"/>
      <rect x="0" y="75" width="58" height="12" fill="#C8FF00"/>
      <rect x="98" y="10" width="14" height="126" fill="#C8FF00"/>
      <rect x="98" y="136" width="68" height="14" fill="#C8FF00"/>
      <rect x="152" y="10" width="14" height="126" fill="#C8FF00"/>
      <rect x="188" y="10" width="68" height="14" fill="#C8FF00"/>
      <rect x="188" y="10" width="14" height="140" fill="#C8FF00"/>
      <rect x="188" y="136" width="68" height="14" fill="#C8FF00"/>
      <rect x="285" y="20" width="10" height="120" fill="#f0ede8"/>
      <rect x="313" y="20" width="10" height="120" fill="#f0ede8"/>
      <rect x="272" y="62" width="50" height="10" fill="#f0ede8"/>
      <rect x="272" y="90" width="50" height="10" fill="#f0ede8"/>
      <polygon points="368,150 390,10 396,10 404,10 410,10 432,150 418,150 400,46 382,150" fill="#C8FF00"/>
      <rect x="376" y="92" width="48" height="12" fill="#C8FF00"/>
    </svg>

    <svg class="logo-svg glitch-layer glitch-layer-2" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;top:0;left:0;">
      <rect x="285" y="20" width="10" height="120" fill="#ff2200" opacity="0.8"/>
      <rect x="313" y="20" width="10" height="120" fill="#ff2200" opacity="0.8"/>
      <rect x="272" y="62" width="50" height="10" fill="#ff2200" opacity="0.8"/>
      <rect x="272" y="90" width="50" height="10" fill="#ff2200" opacity="0.8"/>
    </svg>
  </div>

  <div class="tagline">
    The Future Starts Here &nbsp;·&nbsp; <span>Toronto</span> &nbsp;·&nbsp; Limited Drops
  </div>

  <div class="waitlist">
    <div class="waitlist-label">Drop 001 — Be First</div>
    <div class="waitlist-row">
      <input class="waitlist-input" type="email" placeholder="your@email.com" id="emailInput"/>
      <button class="waitlist-btn" onclick="handleSubmit()">Notify Me</button>
    </div>
    <div class="success-msg" id="successMsg">You're in. Watch for DROP 001 — 2035.</div>
    <div class="waitlist-note" id="waitlistNote">100 units · no restock · no exceptions</div>
  </div>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="bottom-left">© 2025 Fucha Inc. All Rights Reserved.</div>
  <div class="bottom-right">wearfucha.ca</div>
</div>

<!-- SIDEBAR DOWNLOAD HINTS -->
<div class="download-section">
  <button class="dl-btn primary" onclick="downloadSVG()">Save Logo SVG</button>
  <button class="dl-btn" onclick="window.print()">Save Page PDF</button>
</div>

<script>
  function handleSubmit() {
    const email = document.getElementById('emailInput').value;
    if (!email || !email.includes('@')) {
      document.getElementById('emailInput').style.borderBottom = '1px solid #ff2200';
      return;
    }
    document.querySelector('.waitlist-row').style.display = 'none';
    document.getElementById('waitlistNote').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  }

  function downloadSVG() {
    const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FUC#A Logo">
  <!-- FUC#A Logo — Created for FUCHA brand — All rights reserved Fucha Inc. 2025 -->
  <!-- F -->
  <rect x="0" y="10" width="14" height="140" fill="#f0ede8"/>
  <rect x="0" y="10" width="72" height="14" fill="#f0ede8"/>
  <rect x="0" y="75" width="58" height="12" fill="#f0ede8"/>
  <!-- U -->
  <rect x="98" y="10" width="14" height="126" fill="#f0ede8"/>
  <rect x="98" y="136" width="68" height="14" fill="#f0ede8"/>
  <rect x="152" y="10" width="14" height="126" fill="#f0ede8"/>
  <!-- C -->
  <rect x="188" y="10" width="68" height="14" fill="#f0ede8"/>
  <rect x="188" y="10" width="14" height="140" fill="#f0ede8"/>
  <rect x="188" y="136" width="68" height="14" fill="#f0ede8"/>
  <!-- # HASH — acid green -->
  <rect x="285" y="20" width="10" height="120" fill="#C8FF00"/>
  <rect x="313" y="20" width="10" height="120" fill="#C8FF00"/>
  <rect x="272" y="62" width="50" height="10" fill="#C8FF00"/>
  <rect x="272" y="90" width="50" height="10" fill="#C8FF00"/>
  <!-- A -->
  <polygon points="368,150 390,10 396,10 404,10 410,10 432,150 418,150 400,46 382,150" fill="#f0ede8"/>
  <rect x="376" y="92" width="48" height="12" fill="#f0ede8"/>
</svg>`;

    const blob = new Blob([svgContent], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fucha-logo.svg';
    a.click();
    URL.revokeObjectURL(url);
  }

  // Subtle cursor trail
  document.addEventListener('mousemove', (e) => {
    const dot = document.createElement('div');
    dot.style.cssText = `
      position: fixed;
      left: ${e.clientX}px;
      top: ${e.clientY}px;
      width: 3px;
      height: 3px;
      background: #C8FF00;
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
      transition: opacity 0.6s;
    `;
    document.body.appendChild(dot);
    setTimeout(() => { dot.style.opacity = '0'; }, 100);
    setTimeout(() => dot.remove(), 700);
  });
</script>

</body>
</html>
